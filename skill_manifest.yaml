id: openclaw.clawshelf
version: 0.1.0
license: MIT
intended_use:
  summary: Local document-shelf normalization, source-traceable retrieval, knowledge mapping, and proactive idea generation.
  scope: internal development and evaluation
  not_for:
    - autonomous investment decisions
    - clinical or legal advice
    - broad web crawling
    - source-file modification
inputs:
  - name: input_root
    type: directory_path
    formats: [markdown, text, pdf, xlsx, url-list, mixed-local-files]
  - name: shelf_plan
    type: object
    optional: true
outputs:
  - name: normalized_records
    type: markdown_files
    path: "<input_root>/clawshelf/normalized/*.md"
  - name: metadata
    type: markdown_file
    path: "<input_root>/clawshelf/clawshelf-metadata.md"
  - name: brief
    type: markdown_file
    path: "<input_root>/clawshelf/clawshelf-brief.md"
    optional: true
  - name: overview
    type: html_file
    path: "<input_root>/clawshelf/clawshelf-overview.html"
    optional: true
    self_contained: false
  - name: watch_event
    type: json_file
    path: "<input_root>/clawshelf/events/*.json"
    optional: true
  - name: watch_notification
    type: json_file
    path: "<input_root>/clawshelf/notifications/*.notification.json"
    optional: true
runtime:
  language: python
  entrypoint: scripts/extract-source.py
  overview_command: scripts/render-overview.py
  watch:
    auto_enable_when_installed_in_openclaw_agent: true
    use_command: scripts/openclaw-use.py
    command: scripts/openclaw-watch-adapter.py
    raw_event_command: scripts/watch-shelf.py
    event_schema: clawshelf.watch-event
    event_dir: "<input_root>/clawshelf/events"
    notification_schema: clawshelf.notification
    notification_dir: "<input_root>/clawshelf/notifications"
    push_policy:
      P1: notify
      P2: notify
    requires_explicit_folder: true
  python: ">=3.11"
  dependencies:
    html2text: ">=2024.2.26"
    openpyxl: ">=3.1.5,<4"
    watchfiles: ">=1.1.0,<2"
  side_effects:
    local_writes:
      - path: "<input_root>/clawshelf/"
        purpose: generated normalized records, metadata, optional brief, and optional overview
    source_file_writes: []
    home_writes: []
    network_endpoints:
      - "explicit user-provided URLs only"
      - "cdn.jsdelivr.net (opening clawshelf-overview.html only; version-pinned + SRI)"
    requires_docker: false
    requires_gpu: none
    env_required: []
  cdn_subresources:
    # Loaded by clawshelf-overview.html at open time. Every URL is version-pinned
    # and carries a sha384 integrity attribute, so a substituted bundle is refused
    # by the browser. The page needs network access when it is opened.
    - url: https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js
      version: "7.9.0"
      integrity: sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i
      license: ISC
      purpose: rendering library for the interactive neural map
    - url: https://cdn.jsdelivr.net/npm/d3-octree@1.1.0/dist/d3-octree.min.js
      version: "1.1.0"
      integrity: sha384-hUTIiRoVMThdazpg0sq2HBUqxGkxQUqTjwmWCLBcj0bN66J1dZn4LKfrgH5JFRIO
      license: MIT
      purpose: d3-force-3d dependency
    - url: https://cdn.jsdelivr.net/npm/d3-binarytree@1.0.2/dist/d3-binarytree.min.js
      version: "1.0.2"
      integrity: sha384-F8zw7JKCwK5i0lckYtAlEACGf/JO5Lykne9c64a0A7slh6UvriVvwvZiF0wdf6Bc
      license: MIT
      purpose: d3-force-3d dependency
    - url: https://cdn.jsdelivr.net/npm/d3-force-3d@3.0.6/dist/d3-force-3d.min.js
      version: "3.0.6"
      integrity: sha384-dki4I11AcMLPaqZ+ynfRGxIxP8Hfmc0xxsWZrgiHUF1D7kTfbwm6yHoduDZPfyxq
      license: MIT
      purpose: 3D force layout behind the neural map
limitations:
  - QMD is a backend retrieval dependency, not the user interface.
  - URL extraction fetches only explicitly provided URLs and does not crawl.
  - Scanned PDFs without selectable text may need OCR outside the built-in extraction pipeline.
  - Shelf configuration and inferred onboarding answers are persisted in `<input_root>/clawshelf/clawshelf-config.json`.
  - The interactive overview loads D3 and the d3-force-3d family from a version-pinned, SRI-guarded CDN, so opening it requires network access; offline it shows a notice instead of the map.
validation:
  local_commands:
    - "uv run --locked python -m unittest discover -s tests"
    - "uv run --locked python scripts/openclaw-watch-adapter.py <quant-trading-test-folder> --once <p1-test-file>"
  expected_behavior:
    - Writes stay under "<input_root>/clawshelf/".
    - Unsupported unreadable files are skipped instead of guessed from names.
    - Factual claims cite source records or original sources.
    - Idea generation labels speculation and confidence.
    - Installed OpenClaw agents expose /clawshelf watch automatically, but only watch an explicit folder.
    - /clawshelf use checks watcher state and auto-starts watch for ready folders when no watcher exists.
    - OpenClaw watcher delivery prefers the session key captured when /clawshelf use enables the watcher.
    - P1 and P2 watch events produce enabled notification records by default; `p1_only` keeps P2 log-only.
    - Watch delivery does not store provider-specific channel targets in shelf data.
    - /clawshelf overview writes one HTML artifact on explicit invocation and never refreshes it from watch intake.
    - The overview HTML loads only its four version-pinned, SRI-guarded CDN subresources.
